name: Run Linter Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize DuckDB
        run: git submodule update --init --depth 1 external/duckdb

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make cppcheck

      - name: Run linter checks
        run: make lint
