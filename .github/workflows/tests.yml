name: Run Tests

on:
  workflow_dispatch:
  schedule: # Run every day at midnight (UTC)
    - cron: '0 0 * * *'
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set things up
        run: git submodule update --init --depth 1 external/duckdb external/esp-idf

      - name: Install dependencies
        uses: cachix/install-nix-action@v31

      - name: Run tests
        run: nix develop -c make test

  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      IDF_TOOLS_PATH: ${{ github.workspace }}/build/espressif
      IDF_CCACHE_ENABLE: '1'
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
      JOBS: '2'

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read ESP-IDF revision
        id: idf
        run: echo "revision=$(git -C external/esp-idf rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        uses: cachix/install-nix-action@v31

      - name: Cache ESP-IDF tools
        uses: actions/cache@v4
        with:
          path: build/espressif
          key: esp-idf-nix-${{ runner.arch }}-${{ steps.idf.outputs.revision }}-${{ hashFiles('flake.nix', 'flake.lock') }}-v1

      - name: Cache compiled objects
        uses: actions/cache@v4
        with:
          path: build/ccache
          key: firmware-ubuntu-24.04-${{ runner.arch }}-${{ steps.idf.outputs.revision }}-${{ github.sha }}
          restore-keys: |
            firmware-ubuntu-24.04-${{ runner.arch }}-${{ steps.idf.outputs.revision }}-

      - name: Install ESP-IDF tools and Espressif Clang
        run: nix develop -c make espidf-install

      - name: Build probe and shell firmware
        run: nix develop -c make shell-build

      - name: Show compiler cache statistics
        if: always()
        run: nix develop -c ccache --show-stats

      - name: Package firmware for release
        if: startsWith(github.ref, 'refs/tags/')
        run: nix develop -c make firmware-package

      - name: Upload firmware packages
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/duckdb-micro-*.tar.gz
          if-no-files-found: error
          overwrite: true

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download firmware packages
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [ "$draft" != true ]; then
              echo "Release $RELEASE_TAG is already published; leaving it unchanged."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" firmware/*.tar.gz --clobber
