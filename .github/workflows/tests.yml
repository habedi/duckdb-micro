name: Run Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set things up
        run: git submodule update --init --depth 1 external/duckdb external/esp-idf

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make g++ python3

      - name: Run tests
        run: make test
